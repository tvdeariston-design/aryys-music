<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aryys Music - Gerador de Música</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .glow { box-shadow: 0 0 30px rgba(139, 92, 246, 0.3); }
    </style>
</head>
<body class="text-white">
    <div class="max-w-2xl mx-auto px-4 py-12">
        <div class="text-center mb-12">
            <div class="w-20 h-20 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-3xl glow">♪</div>
            <h1 class="text-4xl font-bold mb-2">Aryys Music</h1>
            <p class="text-gray-400 text-lg">Gere músicas únicas com IA</p>
        </div>

        <div class="glass rounded-2xl p-8 glow">
            <form id="musicForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Estilo Musical</label>
                    <select id="estilo" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/10 text-white focus:outline-none focus:border-purple-500 transition">
                        <option value="Pop">Pop</option>
                        <option value="Rock">Rock</option>
                        <option value="Eletrônica">Eletrônica</option>
                        <option value="Lo-fi">Lo-fi</option>
                        <option value="Clássica">Clássica</option>
                        <option value="Jazz">Jazz</option>
                        <option value="Hip Hop">Hip Hop</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Descrição</label>
                    <textarea id="prompt" rows="3" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/10 text-white focus:outline-none focus:border-purple-500 transition placeholder-gray-500" placeholder="Descreva a música que deseja gerar..."></textarea>
                </div>
                <div>
                    <label for="audioUpload" class="block text-sm font-medium text-gray-300 mb-2">Carregar voz de referência:</label>
                    <input type="file" id="audioUpload" accept="audio/*" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/10 text-white file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-500 focus:outline-none focus:border-purple-500 transition">
                </div>
                <button type="submit" id="btnGerar" class="w-full py-4 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 font-semibold text-lg hover:from-purple-500 hover:to-pink-500 transition-all glow">
                    Gerar Música
                </button>
            </form>
            <div id="result" class="mt-6 p-4 rounded-xl bg-white/5 border border-white/10 hidden"></div>
        </div>

        <p class="text-center text-gray-500 text-sm mt-8">© 2026 Aryys Music. Todos os direitos reservados.</p>
    </div>

    <script>
        document.getElementById('btnGerar').addEventListener('click', (e) => {
            alert("O botão foi clicado!");
            e.preventDefault();
            const btn = e.target;
            btn.textContent = 'Gerando...';
            btn.disabled = true;

            const style = document.getElementById('estilo').value;
            const description = document.getElementById('prompt').value;

            alert('Fetch disparado');
            fetch('https://aryys-music.anyclaw.store/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ style, description })
            })
            .then(response => response.json())
            .then(data => {
                alert('Resposta recebida');
                if (data.success) {
                    document.getElementById('result').innerText = data.message;
                    let audioPlayer = document.getElementById('audioPlayer');
                    if (!audioPlayer) {
                        audioPlayer = document.createElement('audio');
                        audioPlayer.id = 'audioPlayer';
                        audioPlayer.controls = true;
                        document.getElementById('result').appendChild(audioPlayer);
                    }
                    audioPlayer.src = data.audio_preview;
                    audioPlayer.style.display = 'block';
                    document.getElementById('result').classList.remove('hidden');
                }
            })
            .catch(err => {
                alert('Erro ao gerar música. Tente novamente.');
            })
            .finally(() => {
                btn.textContent = 'Gerar Música';
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
